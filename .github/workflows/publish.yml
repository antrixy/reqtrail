name: publish

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  - run: npm --version
  - run: npm whoami || echo "not authenticated"
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - run: npm install -g npm@latest
      - run: npm publish
